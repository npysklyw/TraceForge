name: benchwarden
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${BENCHWARDEN_POSTGRES_USER:-benchwarden}
      POSTGRES_PASSWORD: ${BENCHWARDEN_POSTGRES_PASSWORD:-benchwarden}
      POSTGRES_DB: ${BENCHWARDEN_POSTGRES_DB:-benchwarden}
    ports:
      - "127.0.0.1:${BENCHWARDEN_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      BENCHWARDEN_DATABASE_URL: postgresql+psycopg://${BENCHWARDEN_POSTGRES_USER:-benchwarden}:${BENCHWARDEN_POSTGRES_PASSWORD:-benchwarden}@db:5432/${BENCHWARDEN_POSTGRES_DB:-benchwarden}
      BENCHWARDEN_TEST_DATABASE_URL: postgresql+psycopg://${BENCHWARDEN_POSTGRES_USER:-benchwarden}:${BENCHWARDEN_POSTGRES_PASSWORD:-benchwarden}@db:5432/${BENCHWARDEN_POSTGRES_DB:-benchwarden}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn benchwarden.main:app --host 0.0.0.0 --port 8000 --reload"]
    ports:
      - "127.0.0.1:${BENCHWARDEN_BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/src:/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    environment:
      BENCHWARDEN_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:${BENCHWARDEN_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
    name: ${BENCHWARDEN_POSTGRES_VOLUME:-benchwarden_postgres_data}
